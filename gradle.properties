# Configuração de compilação — TEA Descomplica
# Toolchain de compilação: Java 17 (Temurin)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=true
android.useAndroidX=true
ksp.codegen.eager=false

# Preserve installed APKs after connected device tests.
android.injected.androidTest.leaveApksInstalledAfterRun=true
